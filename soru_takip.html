<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soru Takip - 6A</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;padding:15px;background:#f4f7f6;font-size:15px;color:#333}
.container{max-width:800px;margin:0 auto}
.form-section{background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);margin-bottom:15px}
.form-group{margin-bottom:12px}
label{display:block;font-weight:bold;margin-bottom:5px;font-size:13px;color:#2c3e50}
select,input[type=date],input[type=number],input[type=text],textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;background:#fafafa;font-family:inherit}
.numbers-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;color:#fff;font-family:inherit}
.btn-save{background:#27ae60}.btn-update{background:#f39c12}.btn-cancel{background:#95a5a6}.btn-show-report{background:#3498db}
.info-display{background:#e8f4fd;border:2px solid #3498db;border-radius:8px;padding:12px;text-align:center}
.info-display .info-label{font-size:12px;color:#666;display:block;margin-bottom:4px}
.info-display .info-value{font-size:20px;color:#3498db;font-weight:bold}
.records-panel{background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);margin-bottom:15px;border-left:5px solid #3498db}
.records-panel h3{margin:0 0 10px 0;font-size:15px;color:#2c3e50}
.records-panel h3 span{font-size:12px;color:#666;font-weight:normal}
.record-card{background:#f9f9f9;padding:10px;border-radius:8px;margin-bottom:8px;border-left:4px solid #27ae60;font-size:13px}
.record-card.editing{border-left-color:#f39c12;background:#fff8e1}
.record-card .record-header{display:flex;justify-content:space-between;font-weight:bold;color:#2c3e50;margin-bottom:5px}
.record-card .record-details{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:5px;font-size:12px}
.record-card .record-details span.d{color:#27ae60;font-weight:bold}
.record-card .record-details span.y{color:#e74c3c;font-weight:bold}
.record-card .record-details span.b{color:#888;font-weight:bold}
.record-card .record-note{font-size:11px;color:#555;font-style:italic;background:#fff;padding:4px 6px;border-radius:4px;margin-top:4px}
.record-card .record-actions{display:flex;gap:6px;margin-top:8px}
.record-card .record-actions button{flex:1;padding:8px;font-size:12px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-edit{background:#f39c12;color:#fff}.btn-delete{background:#e74c3c;color:#fff}
.empty-state{text-align:center;color:#999;font-size:13px;padding:15px;font-style:italic}
.hidden{display:none!important}
#reportSection{display:none;margin-top:20px;background:#fff;padding:15px;width:100%;overflow-x:auto}
.report-header{text-align:center;font-weight:bold;font-size:15px;border:2px solid #000;padding:6px;margin-bottom:6px}
.report-info{display:flex;justify-content:space-between;border:1px solid #000;padding:6px;font-weight:bold;font-size:12px;margin-bottom:6px;flex-wrap:wrap;gap:5px}
.print-table{width:100%;min-width:1050px;border-collapse:collapse;table-layout:fixed;font-size:11px;margin-bottom:0;border:1px solid #000}
.print-table td{border:1px solid #000;text-align:center;vertical-align:middle;padding:1px;height:28px}
.print-table td.header-cell{font-weight:bold;background:#e0e0e0}
.week-col{width:28px;background:#c8d0e0;font-weight:bold;text-align:center;vertical-align:middle;font-size:10px;padding:4px 2px;color:#2c3e50;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:2px}
.col-day{width:65px;background:#e0e0e0;font-weight:bold;font-size:10px}
.col-ty{width:12px;font-size:9px;background:#e0e0e0;font-weight:bold}
.col-total{width:42px;font-size:10px;background:#d0e0f0;font-weight:bold}
.col-veli{width:170px;font-size:9px;text-align:left;padding:4px;word-wrap:break-word;white-space:normal;vertical-align:middle;line-height:1.2;background:#fffef5}
.lesson-header{background:#e0e0e0;font-size:8px;padding:2px 0;font-weight:bold}
.report-footer{display:flex;justify-content:flex-start;margin-top:0;padding-top:2px;font-weight:bold;font-size:12px;color:#2c3e50}
.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.report-actions .btn{margin-top:0;font-size:14px;padding:12px 5px}
.btn-pdf{background:#e74c3c}.btn-jpg{background:#f39c12}
.btn-back{background:#7f8c8d;grid-column:span 2}
.btn-share{background:#25D366;grid-column:span 2}
.exporting .report-actions{display:none!important}
.settings-btn{position:fixed;top:15px;right:15px;width:48px;height:48px;border-radius:50%;background:#2c3e50;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:999;transition:transform .2s,background .2s}
.settings-btn:hover{background:#3498db;transform:scale(1.05)}
.settings-btn:active{transform:scale(.95)}
.settings-btn svg{stroke:#fff;display:block}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;padding:15px}
.modal-overlay.active{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-box h2{margin:0 0 15px 0;font-size:18px;color:#2c3e50;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:#e74c3c;color:#fff;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;font-weight:bold}
.modal-box .form-group{margin-bottom:12px}
.modal-box label{font-size:12px;color:#555;margin-bottom:4px}
.modal-box input{font-size:15px;padding:10px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.modal-actions .btn{margin-top:0;padding:12px;font-size:14px}
.btn-modal-save{background:#27ae60}
.btn-modal-cancel{background:#95a5a6}
@page{size:A4 landscape;margin:6mm}
@media print{
body{background:#fff;padding:0;margin:0}
.no-print{display:none!important}
.settings-btn{display:none!important}
.modal-overlay{display:none!important}
#reportSection{display:block!important;padding:0;margin:0;overflow:visible;width:100%}
.print-table{min-width:100%;page-break-inside:avoid;font-size:9px}
.col-veli{background:#fffef5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<button type="button" class="settings-btn no-print" onclick="ayarlariAc()" title="&#214;&#287;renci Bilgilerini D&#252;zenle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
    </svg>
</button>

<div class="modal-overlay no-print" id="settingsModal">
    <div class="modal-box">
        <h2>
            <span>&#128100; &#214;&#287;renci Bilgileri</span>
            <button type="button" class="modal-close" onclick="ayarlariKapat()">&#10005;</button>
        </h2>
        <div class="form-group"><label>Ad&#305; Soyad&#305;</label><input type="text" id="settingAd"></div>
        <div class="form-group"><label>S&#305;n&#305;f / No</label><input type="text" id="settingSinif"></div>
        <div class="form-group"><label>S&#305;n&#305;f Rehber &#214;&#287;retmeni</label><input type="text" id="settingOgretmen"></div>
        <div class="modal-actions">
            <button type="button" class="btn btn-modal-cancel" onclick="ayarlariKapat()">&#10060; &#304;ptal</button>
            <button type="button" class="btn btn-modal-save" onclick="ayarlariKaydet()">&#128190; Kaydet</button>
        </div>
    </div>
</div>

<div class="container">
<div id="formSection" class="no-print">
<div class="form-section" style="text-align:center">
<h2 style="margin:0;color:#2c3e50">Veri Giri&#351; Formu</h2>
<p style="margin:5px 0 0 0;font-size:13px;color:#666" id="formOgrenciInfo">Y&#252;kleniyor...</p>
</div>
<div class="form-section">
<div class="form-group">
<label>&#128197; Hafta</label>
<div class="info-display"><span class="info-label">Otomatik se&#231;ildi:</span><span class="info-value" id="weekDisplayValue">...</span></div>
<label style="margin-top:10px;font-size:11px;color:#888;font-weight:normal">Farkl&#305; hafta se&#231;:</label>
<select id="weekSelect">
<option value="1. Hafta">1. Hafta</option>
<option value="2. Hafta">2. Hafta</option>
<option value="3. Hafta">3. Hafta</option>
<option value="4. Hafta">4. Hafta</option>
<option value="5. Hafta">5. Hafta</option>
</select>
</div>
<div class="form-group">
<label>&#128198; Tarih</label>
<div class="info-display"><span class="info-label">Otomatik se&#231;ildi:</span><span class="info-value" id="dateDisplayValue">...</span></div>
<label style="margin-top:10px;font-size:11px;color:#888;font-weight:normal">Farkl&#305; tarih se&#231;:</label>
<input type="date" id="dateInput" onchange="tarihDegisti()">
</div>
<div class="form-group">
<label>&#128218; Ders Se&#231;imi</label>
<select id="lessonSelect">
<option value="T&#252;rk&#231;e">T&#252;rk&#231;e</option>
<option value="Paragraf">Paragraf</option>
<option value="Matematik">Matematik</option>
<option value="Fen Bilgisi">Fen Bilgisi</option>
<option value="Sosyal Bilgisi">Sosyal Bilgisi</option>
<option value="Din K&#252;lt&#252;r&#252;">Din K&#252;lt&#252;r&#252;</option>
<option value="&#304;ngilizce">&#304;ngilizce</option>
</select>
</div>
<div class="numbers-row">
<div class="form-group"><label>&#128221; Soru</label><input type="number" id="soruInput" min="0" placeholder="0" oninput="bosHesapla()"></div>
<div class="form-group"><label>&#9989; Do&#287;ru</label><input type="number" id="dogruInput" min="0" placeholder="0" oninput="bosHesapla()"></div>
<div class="form-group"><label>&#10060; Yanl&#305;&#351;</label><input type="number" id="yanlisInput" min="0" placeholder="0" oninput="bosHesapla()"></div>
</div>
<div class="form-group" style="text-align:center;background:#eef;padding:8px;border-radius:8px">
<label style="color:#555">&#9898; Bo&#351; (Otomatik): <span id="bosGoster" style="color:#e74c3c;font-size:18px">0</span></label>
</div>
<div class="form-group"><label>&#128172; Veli Yorumu</label><textarea id="veliYorum" rows="3"></textarea></div>
<button type="button" class="btn btn-save" id="btnKaydet" onclick="kaydet()">&#128190; Kaydet</button>
<button type="button" class="btn btn-update hidden" id="btnGuncelle" onclick="guncelle()">&#9999;&#65039; G&#252;ncelle</button>
<button type="button" class="btn btn-cancel hidden" id="btnIptal" onclick="duzenlemeyiIptalEt()">&#10060; &#304;ptal Et</button>
<button type="button" class="btn btn-show-report" onclick="raporuGoster()">&#128202; Raporu G&#246;r&#252;nt&#252;le</button>
<button type="button" class="btn" style="background:#e74c3c;margin-top:20px" onclick="verileriTemizle()">&#128465;&#65039; T&#252;m Verileri Sil</button>
</div>
<div class="records-panel" id="recordsPanel">
<h3>&#128203; Se&#231;ili Tarihe Ait Kay&#305;tlar <span id="selectedDateLabel"></span></h3>
<div id="recordsList"></div>
</div>
</div>
<div id="reportSection">
<div class="report-header">CENG&#304;Z TOPEL ORTAOKULU 6A. SINIF SORU TAK&#304;P &#199;&#304;ZELGES&#304;</div>
<div class="report-info">
<div>Ad&#305; Soyad&#305;: <span id="raporAd">-</span></div>
<div>&#214;&#287;renci No: <span id="raporNo">-</span></div>
<div>Hedef Lise: ............</div>
<div>Hedef Meslek: ............</div>
</div>
<div id="tablesContainer"></div>
<div class="report-footer" id="raporOgretmen">-</div>
<div class="report-actions no-print">
<button type="button" class="btn btn-back" onclick="formuGoster()">&#11013;&#65039; Geri D&#246;n</button>
<button type="button" class="btn btn-pdf" onclick="pdfIndir()">&#128196; PDF</button>
<button type="button" class="btn btn-jpg" onclick="jpgIndir()">&#128444;&#65039; JPG</button>
<button type="button" class="btn btn-share" onclick="paylas()">&#128242; WhatsApp / Telegram / BiP</button>
</div>
</div>
</div>
<script>
var DERSLER=["T\u00FCrk\u00E7e","Paragraf","Matematik","Fen Bilgisi","Sosyal Bilgisi","Din K\u00FClt\u00FCr\u00FC","\u0130ngilizce"];
var GUNLER=["Pazartesi","Sal\u0131","\u00C7ar\u015Famba","Per\u015Fembe","Cuma","Cumartesi","Pazar"];
var duzenlenenKayitId=null;
var DEF={ad:'Elif Ya\u011Fmur \u00C7ET\u0130NTA\u015E',sinif:'6A / 203',ogretmen:'Sultan KANDEM\u0130R 6/A S\u0131n\u0131f Rehber \u00D6\u011Fretmeni'};

function ogrenciYukle(){
    var s={};
    try{s=JSON.parse(localStorage.getItem('soruTakipOgrenci'))||{};}catch(e){}
    return {ad:s.ad||DEF.ad,sinif:s.sinif||DEF.sinif,ogretmen:s.ogretmen||DEF.ogretmen};
}

function ogrenciGuncelle(){
    var o=ogrenciYukle();
    var fi=document.getElementById('formOgrenciInfo');
    if(fi)fi.textContent=o.ad+' - '+o.sinif;
    var ra=document.getElementById('raporAd');
    if(ra)ra.textContent=o.ad;
    var np=o.sinif.split('/');
    var rn=document.getElementById('raporNo');
    if(rn)rn.textContent=np[1]?np[1].trim():o.sinif;
    var ro=document.getElementById('raporOgretmen');
    if(ro)ro.textContent=o.ogretmen;
}

function ayarlariAc(){
    var o=ogrenciYukle();
    document.getElementById('settingAd').value=o.ad;
    document.getElementById('settingSinif').value=o.sinif;
    document.getElementById('settingOgretmen').value=o.ogretmen;
    document.getElementById('settingsModal').classList.add('active');
}
function ayarlariKapat(){
    document.getElementById('settingsModal').classList.remove('active');
}
function ayarlariKaydet(){
    var ad=document.getElementById('settingAd').value.trim();
    var sinif=document.getElementById('settingSinif').value.trim();
    var ogretmen=document.getElementById('settingOgretmen').value.trim();
    if(!ad||!sinif||!ogretmen){alert('L\u00FCtfen t\u00FCm alanlar\u0131 doldurun!');return;}
    localStorage.setItem('soruTakipOgrenci',JSON.stringify({ad:ad,sinif:sinif,ogretmen:ogretmen}));
    ogrenciGuncelle();
    ayarlariKapat();
    alert('\u2705 Bilgiler g\u00FCncellendi!');
}
document.getElementById('settingsModal').addEventListener('click',function(e){
    if(e.target===this)ayarlariKapat();
});
document.addEventListener('keydown',function(e){
    if(e.key==='Escape')ayarlariKapat();
});

function getWeekOfMonth(){
    var t=new Date();
    var f=new Date(t.getFullYear(),t.getMonth(),1);
    var d=f.getDay();
    if(d===0)d=7;
    var w=Math.ceil((t.getDate()+d-1)/7);
    if(w<1)w=1;if(w>5)w=5;
    return w;
}
function haftaOtomatikSec(){
    var w=getWeekOfMonth();
    var v=w+'. Hafta';
    var s=document.getElementById('weekSelect');
    s.value=v;s.selectedIndex=w-1;
    document.getElementById('weekDisplayValue').textContent='\uD83D\uDCCC '+v;
}
function tarihOtomatikSec(){
    var t=new Date();
    var y=t.getFullYear();
    var m=String(t.getMonth()+1).padStart(2,'0');
    var d=String(t.getDate()).padStart(2,'0');
    document.getElementById('dateInput').value=y+'-'+m+'-'+d;
    document.getElementById('dateDisplayValue').textContent='\uD83D\uDCC5 '+d+'.'+m+'.'+y;
}
function bosHesapla(){
    var s=parseInt(document.getElementById('soruInput').value)||0;
    var d=parseInt(document.getElementById('dogruInput').value)||0;
    var y=parseInt(document.getElementById('yanlisInput').value)||0;
    document.getElementById('bosGoster').textContent=Math.max(0,s-d-y);
}
function formatTarih(ds){
    if(!ds)return'';
    var p=ds.split('-');
    return p[2]+'.'+p[1]+'.'+p[0];
}
function tarihDegisti(){
    var d=document.getElementById('dateInput').value;
    if(d){
        var p=d.split('-');
        document.getElementById('dateDisplayValue').textContent='\uD83D\uDCC5 '+p[2]+'.'+p[1]+'.'+p[0];
    }
    document.getElementById('selectedDateLabel').textContent='('+formatTarih(d)+')';
    listeleTariheGoreKayitlar(d);
}

function listeleTariheGoreKayitlar(date){
    var k=[];
    try{k=JSON.parse(localStorage.getItem('soruTakipVerileri'))||[];}catch(e){}
    var div=document.getElementById('recordsList');
    var tk=k.filter(function(x){return x.date===date;});
    if(tk.length===0){div.innerHTML='<div class="empty-state">Bu tarihe ait hen\u00FCz kay\u0131t bulunmuyor.</div>';return;}
    tk.sort(function(a,b){return DERSLER.indexOf(a.lesson)-DERSLER.indexOf(b.lesson);});
    var h='';
    tk.forEach(function(x){
        var e=(x.id===duzenlenenKayitId);
        var b=Math.max(0,(x.soru||0)-(x.dogru||0)-(x.yanlis||0));
        h+='<div class="record-card '+(e?'editing':'')+'">';
        h+='<div class="record-header"><span>'+x.lesson+'</span><span>'+x.week+'</span></div>';
        h+='<div class="record-details">';
        h+='<span>\uD83D\uDCDD Soru: '+(x.soru||0)+'</span>';
        h+='<span class="d">\u2705 D: '+(x.dogru||0)+'</span>';
        h+='<span class="y">\u274C Y: '+(x.yanlis||0)+'</span>';
        h+='<span class="b">\u26AA B: '+b+'</span>';
        h+='</div>';
        if(x.veliYorum)h+='<div class="record-note">\uD83D\uDCAC '+x.veliYorum+'</div>';
        h+='<div class="record-actions">';
        h+='<button type="button" class="btn-edit" onclick="duzenle('+x.id+')">\u270F\uFE0F D\u00FCzenle</button>';
        h+='<button type="button" class="btn-delete" onclick="sil('+x.id+')">\uD83D\uDDD1\uFE0F Sil</button>';
        h+='</div></div>';
    });
    div.innerHTML=h;
}

function kaydet(){
    var w=document.getElementById('weekSelect').value;
    var l=document.getElementById('lessonSelect').value;
    var d=document.getElementById('dateInput').value;
    var s=parseInt(document.getElementById('soruInput').value)||0;
    var dg=parseInt(document.getElementById('dogruInput').value)||0;
    var y=parseInt(document.getElementById('yanlisInput').value)||0;
    var v=document.getElementById('veliYorum').value.trim();
    if(!d){alert('L\u00FCtfen tarih se\u00E7in!');return;}
    if(s===0){alert('L\u00FCtfen soru say\u0131s\u0131n\u0131 girin!');return;}
    if(dg+y>s){alert('Do\u011Fru + Yanl\u0131\u015F, soru say\u0131s\u0131ndan fazla olamaz!');return;}
    var nk={id:Date.now(),week:w,lesson:l,date:d,soru:s,dogru:dg,yanlis:y,veliYorum:v};
    var k=[];
    try{k=JSON.parse(localStorage.getItem('soruTakipVerileri'))||[];}catch(e){}
    k.push(nk);
    localStorage.setItem('soruTakipVerileri',JSON.stringify(k));
    formuTemizle();
    listeleTariheGoreKayitlar(d);
    alert('\u2705 Kay\u0131t eklendi!');
}

function duzenle(id){
    var k=[];
    try{k=JSON.parse(localStorage.getItem('soruTakipVerileri'))||[];}catch(e){}
    var x=null;
    for(var i=0;i<k.length;i++){if(k[i].id===id){x=k[i];break;}}
    if(!x)return;
    duzenlenenKayitId=id;
    document.getElementById('weekSelect').value=x.week;
    document.getElementById('weekDisplayValue').textContent='\uD83D\uDCCC '+x.week+' (D\u00FCzenleniyor)';
    document.getElementById('lessonSelect').value=x.lesson;
    document.getElementById('dateInput').value=x.date;
    document.getElementById('dateDisplayValue').textContent='\uD83D\uDCC5 '+formatTarih(x.date);
    document.getElementById('soruInput').value=x.soru||(x.dogru+x.yanlis);
    document.getElementById('dogruInput').value=x.dogru||0;
    document.getElementById('yanlisInput').value=x.yanlis||0;
    document.getElementById('veliYorum').value=x.veliYorum||'';
    bosHesapla();
    document.getElementById('btnKaydet').classList.add('hidden');
    document.getElementById('btnGuncelle').classList.remove('hidden');
    document.getElementById('btnIptal').classList.remove('hidden');
    document.getElementById('formSection').scrollIntoView({behavior:'smooth'});
    listeleTariheGoreKayitlar(x.date);
}

function guncelle(){
    if(duzenlenenKayitId===null)return;
    var w=document.getElementById('weekSelect').value;
    var l=document.getElementById('lessonSelect').value;
    var d=document.getElementById('dateInput').value;
    var s=parseInt(document.getElementById('soruInput').value)||0;
    var dg=parseInt(document.getElementById('dogruInput').value)||0;
    var y=parseInt(document.getElementById('yanlisInput').value)||0;
    var v=document.getElementById('veliYorum').value.trim();
    if(!d||s===0||dg+y>s){alert('L\u00FCtfen bilgileri kontrol edin!');return;}
    var k=[];
    try{k=JSON.parse(localStorage.getItem('soruTakipVerileri'))||[];}catch(e){}
    var idx=-1;
    for(var i=0;i<k.length;i++){if(k[i].id===duzenlenenKayitId){idx=i;break;}}
    if(idx===-1){alert('Kay\u0131t bulunamad\u0131!');return;}
    k[idx].week=w;k[idx].lesson=l;k[idx].date=d;
    k[idx].soru=s;k[idx].dogru=dg;k[idx].yanlis=y;k[idx].veliYorum=v;
    localStorage.setItem('soruTakipVerileri',JSON.stringify(k));
    duzenlemeyiIptalEt();
    alert('\u2705 Kay\u0131t g\u00FCncellendi!');
}

function duzenlemeyiIptalEt(){
    duzenlenenKayitId=null;
    formuTemizle();
    document.getElementById('btnKaydet').classList.remove('hidden');
    document.getElementById('btnGuncelle').classList.add('hidden');
    document.getElementById('btnIptal').classList.add('hidden');
    haftaOtomatikSec();tarihOtomatikSec();tarihDegisti();
}

function sil(id){
    if(!confirm('Bu kayd\u0131 silmek istedi\u011Finize emin misiniz?'))return;
    var k=[];
    try{k=JSON.parse(localStorage.getItem('soruTakipVerileri'))||[];}catch(e){}
    k=k.filter(function(x){return x.id!==id;});
    localStorage.setItem('soruTakipVerileri',JSON.stringify(k));
    if(duzenlenenKayitId===id)duzenlemeyiIptalEt();
    else listeleTariheGoreKayitlar(document.getElementById('dateInput').value);
}

function formuTemizle(){
    document.getElementById('soruInput').value='';
    document.getElementById('dogruInput').value='';
    document.getElementById('yanlisInput').value='';
    document.getElementById('veliYorum').value='';
    document.getElementById('bosGoster').textContent='0';
}

function verileriTemizle(){
    if(confirm('T\u00FCm kay\u0131tl\u0131 veriler silinecek. Emin misiniz?')){
        localStorage.removeItem('soruTakipVerileri');
        listeleTariheGoreKayitlar(document.getElementById('dateInput').value);
        alert('Veriler silindi.');
    }
}

function raporuGoster(){
    document.getElementById('formSection').style.display='none';
    document.getElementById('reportSection').style.display='block';
    ogrenciGuncelle();
    if(typeof cizelgeyiOlustur==='function')cizelgeyiOlustur();
}
function formuGoster(){
    document.getElementById('reportSection').style.display='none';
    document.getElementById('formSection').style.display='block';
    tarihDegisti();
}

document.addEventListener('DOMContentLoaded',function(){
    haftaOtomatikSec();
    tarihOtomatikSec();
    ogrenciGuncelle();
    tarihDegisti();
});
</script>

<script>
function cizelgeyiOlustur(){
    var c=document.getElementById('tablesContainer');
    c.innerHTML='';
    var k=[];
    try{k=JSON.parse(localStorage.getItem('soruTakipVerileri'))||[];}catch(e){}
    var DL=["T\u00FCrk\u00E7e","Paragraf","Matematik","Fen Bilgisi","Sosyal Bilgisi","Din K\u00FClt\u00FCr\u00FC","\u0130ngilizce"];
    var GL=["Pazartesi","Sal\u0131","\u00C7ar\u015Famba","Per\u015Fembe","Cuma","Cumartesi","Pazar"];
    for(var h=1;h<=4;h++){
        var html='<table class="print-table"><tbody><tr>';
        html+='<td rowspan="9" class="week-col">'+h+'. HAFTA</td>';
        html+='<td rowspan="2" class="col-day header-cell">G\u00DCN</td>';
        DL.forEach(function(d){html+='<td colspan="3" class="lesson-header header-cell">'+d+'</td>';});
        html+='<td rowspan="2" class="col-total header-cell">TOPLAM</td>';
        html+='<td rowspan="2" class="col-veli header-cell">VEL\u0130 KONTROL\u00DC</td></tr><tr>';
        DL.forEach(function(){html+='<td class="col-ty">S</td><td class="col-ty">D</td><td class="col-ty">Y</td>';});
        html+='</tr>';
        GL.forEach(function(g,ix){
            html+='<tr><td class="col-day">'+g+'</td>';
            var ts=0;var vn=[];
            DL.forEach(function(dr){
                var jg=(ix+1)%7;
                var kk=null;
                for(var i=0;i<k.length;i++){
                    var x=k[i];
                    if(x.week.indexOf(h+".")!==-1&&x.lesson===dr&&new Date(x.date).getDay()===jg){kk=x;break;}
                }
                var s='',d='',y='';
                if(kk){
                    s=kk.soru||(kk.dogru+kk.yanlis);d=kk.dogru||0;y=kk.yanlis||0;
                    ts+=parseInt(s)||0;
                    if(kk.veliYorum&&kk.veliYorum.trim()!=='')vn.push(kk.veliYorum.trim());
                }
                html+='<td>'+s+'</td><td>'+d+'</td><td>'+y+'</td>';
            });
            html+='<td><strong>'+(ts>0?ts:'')+'</strong></td>';
            var un=[];
            vn.forEach(function(n){if(un.indexOf(n)===-1)un.push(n);});
            html+='<td class="col-veli">'+un.join(' | ')+'</td></tr>';
        });
        html+='</tbody></table>';
        c.innerHTML+=html;
    }
}

function resimOlustur(){
    return new Promise(function(res,rej){
        var el=document.getElementById('reportSection');
        el.classList.add('exporting');
        setTimeout(function(){
            var cl=el.cloneNode(true);
            cl.style.position='fixed';
            cl.style.left='-99999px';
            cl.style.top='0';
            cl.style.width='1123px';
            cl.style.overflow='visible';
            cl.style.padding='8px';
            cl.style.background='#fff';
            var ca=cl.querySelector('.report-actions');
            if(ca)ca.style.display='none';
            var ct=cl.querySelectorAll('.print-table');
            for(var i=0;i<ct.length;i++){
                ct[i].style.minWidth='100%';
                ct[i].style.width='100%';
                ct[i].style.fontSize='10px';
            }
            document.body.appendChild(cl);
            html2canvas(cl,{
                scale:2,useCORS:true,backgroundColor:'#fff',logging:false,
                width:1123,height:cl.scrollHeight
            }).then(function(cv){
                document.body.removeChild(cl);
                el.classList.remove('exporting');
                res(cv);
            }).catch(function(e){
                document.body.removeChild(cl);
                el.classList.remove('exporting');
                rej(e);
            });
        },300);
    });
}

function pdfIndir(){
    resimOlustur().then(function(cv){
        try{
            var jsPDF=window.jspdf.jsPDF;
            var img=cv.toDataURL('image/png');
            var pdf=new jsPDF('l','mm','a4');
            var pw=297,ph=210,mg=4;
            var mw=pw-mg*2,mh=ph-mg*2;
            var ir=cv.width/cv.height,pr=mw/mh;
            var fw,fh;
            if(ir>pr){fw=mw;fh=mw/ir;}else{fh=mh;fw=mh*ir;}
            var x=(pw-fw)/2,y=(ph-fh)/2;
            pdf.addImage(img,'PNG',x,y,fw,fh);
            pdf.save('Soru_Takip_Cizelgesi_6A.pdf');
        }catch(e){console.error(e);alert('PDF olu\u015Fturulamad\u0131.');}
    }).catch(function(e){console.error(e);alert('PDF hatas\u0131.');});
}

function jpgIndir(){
    resimOlustur().then(function(cv){
        var l=document.createElement('a');
        l.download='Soru_Takip_Cizelgesi_6A.png';
        l.href=cv.toDataURL('image/png');
        document.body.appendChild(l);
        l.click();
        document.body.removeChild(l);
    }).catch(function(e){console.error(e);alert('JPG hatas\u0131.');});
}

function paylas(){
    resimOlustur().then(function(cv){
        cv.toBlob(function(blob){
            if(!blob){alert('Resim olu\u015Fturulamad\u0131.');return;}
            var dosyaAdi='Soru_Takip_6A_203.png';
            var baslik='\u00D6\u011Frenci Soru Takip \u00C7izelgesi';
            var metin='Elif Ya\u011Fmur \u00C7ET\u0130NTA\u015E - 6A / 203';
            var f=new File([blob],dosyaAdi,{type:'image/png'});
            if(navigator.canShare&&navigator.canShare({files:[f]})){
                navigator.share({files:[f],title:baslik,text:metin}).catch(function(e){
                    if(e&&e.name!=='AbortError')console.log(e);
                });
            }else{
                var l=document.createElement('a');
                l.download=dosyaAdi;
                l.href=cv.toDataURL('image/png');
                document.body.appendChild(l);
                l.click();
                document.body.removeChild(l);
                setTimeout(function(){
                    window.open('https://wa.me/?text='+encodeURIComponent(metin),'_blank');
                },500);
                alert('Resim indirildi, WhatsApp a\u00E7\u0131ld\u0131.');
            }
        },'image/png');
    }).catch(function(e){console.error(e);alert('Payla\u015F\u0131m hatas\u0131.');});
}
</script>
